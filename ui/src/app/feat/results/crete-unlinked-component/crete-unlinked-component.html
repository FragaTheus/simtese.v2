<p-button label="Novo resultado" icon="pi pi-plus" severity="success" (click)="visible.set(true)" />

<app-dialog-component
  [(visible)]="visible"
  [icon]="'pi pi-file-pdf'"
  [title]="'Cadastrar resultado do exame'"
>
  <form [formGroup]="form" (ngSubmit)="creteUnlinkedResult()">
    <div class="flex flex-col gap-6 w-full">
      <p-floatlabel variant="on">
        <input pInputText formControlName="employeeName" id="employeeName" class="w-full" />
        <label for="employeeName">Nome do funcionário</label>
      </p-floatlabel>

      <p-floatlabel variant="on">
        <input pInputText formControlName="employeeCpf" id="employeeCpf" class="w-full" />
        <label for="employeeCpf">CPF do funcionário</label>
      </p-floatlabel>

      <div class="flex flex-col gap-2">
        <label for="apt" class="text-sm font-medium"> Resultado </label>

        <p-select
          inputId="apt"
          formControlName="apt"
          [options]="aptOptions"
          optionLabel="label"
          optionValue="value"
          placeholder="Selecione o resultado"
          class="w-full"
        />
      </div>

      <div class="flex flex-col gap-2">
        <span class="text-sm font-medium"> Arquivo do exame </span>

        <p-fileupload
          mode="basic"
          chooseLabel="Selecionar PDF"
          chooseIcon="pi pi-file-pdf"
          accept="application/pdf"
          [auto]="false"
          [multiple]="false"
          [customUpload]="true"
          (onSelect)="onFileSelect($event)"
        />
      </div>

      @if (selectedFile() !== null) {
        <div
          class="w-full flex items-center justify-between gap-4 p-3 rounded-md bg-surface-50 border border-surface-200"
        >
          <div class="flex items-center gap-3 min-w-0">
            <i class="pi pi-file-pdf text-red-500 text-xl"></i>

            <div class="flex flex-col min-w-0">
              <span class="text-sm font-medium truncate">
                {{ selectedFile()!.name }}
              </span>

              <span class="text-xs text-surface-500"> PDF selecionado </span>
            </div>
          </div>

          <p-button
            type="button"
            icon="pi pi-times"
            severity="danger"
            [text]="true"
            pTooltip="Remover arquivo"
            tooltipPosition="top"
            (click)="removeFile()"
          />
        </div>
      }

      @if (error() !== null) {
        <div class="w-full p-2 rounded-md text-center text-sm text-red-500 bg-red-50">
          {{ error() }}
        </div>
      }

      @if (success()) {
        <a
          [routerLink]="['/painel/resultados/', resultId()]"
          class="w-full p-2 rounded-md text-center text-sm text-green-500 bg-green-50"
        >
          Resultado cadastrado com sucesso!
        </a>
      }

      <div class="flex items-center gap-2 w-full justify-end">
        <p-button
          label="Cancelar"
          type="button"
          severity="danger"
          [disabled]="loading()"
          (click)="closeDialog()"
        />

        <p-button
          label="Cadastrar"
          type="submit"
          severity="success"
          [loading]="loading()"
          [disabled]="form.invalid || selectedFile() === null"
        />
      </div>
    </div>
  </form>
</app-dialog-component>
