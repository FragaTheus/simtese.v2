@if (showTrigger()) {
  <p-button
    severity="secondary"
    label="Alterar senha"
    icon="pi pi-key"
    (click)="changePasswordDialogVisible.set(true)"
  />
}

<app-dialog-component
  [title]="'Alterar senha'"
  [icon]="'pi pi-key'"
  [(visible)]="changePasswordDialogVisible"
>
  <form [formGroup]="changePasswordForm" (ngSubmit)="changePassword()">
    <div class="flex flex-col gap-6">
      <p-floatlabel>
        <p-password
          [feedback]="false"
          [toggleMask]="true"
          id="currentPassword"
          type="password"
          formControlName="currentPassword"
          pTooltip="Informe sua senha atual para confirmar a alteração"
          tooltipEvent="focus"
          tooltipPosition="top"
        />
        <label for="currentPassword">Senha atual</label>
      </p-floatlabel>
      <p-floatlabel>
        <p-password
          [disabled]="!!changePasswordForm.get('currentPassword')?.invalid"
          [feedback]="false"
          [toggleMask]="true"
          id="password"
          type="password"
          formControlName="password"
          pTooltip="Senha deve conter entre 08 e 16 caracteres, com número, caractere especial, letra maiúscula e minúscula"
          tooltipEvent="focus"
          tooltipPosition="top"
        />
        <label for="password">Nova senha</label>
      </p-floatlabel>
      <p-floatlabel>
        <p-password
          [disabled]="
            !!changePasswordForm.get('currentPassword')?.invalid ||
            !!changePasswordForm.get('password')?.invalid
          "
          [feedback]="false"
          [toggleMask]="true"
          id="confirmPassword"
          type="password"
          formControlName="confirmPassword"
          pTooltip="Confirmação deve ser igual a senha informada"
          tooltipEvent="focus"
          tooltipPosition="top"
        />
        <label for="confirmPassword">Confirmar nova senha</label>
      </p-floatlabel>
      <div class="flex items-center w-full justify-end gap-2">
        <p-button
          severity="danger"
          label="Cancelar"
          (click)="changePasswordDialogVisible.set(false)"
        />
        <p-button severity="success" label="Salvar" type="submit" [loading]="loading()" />
      </div>
    </div>
  </form>
</app-dialog-component>
