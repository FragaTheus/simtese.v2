<section>
  <div class="border-y border-clinical-teal/20 bg-surface-0">
    <app-page-layout>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4 md:justify-items-center">
        @for (bullet of bullets; track bullet.title) {
          <div class="flex items-center gap-4 max-w-3xs">
            <span class="{{ bullet.icon }} text-xl text-clinical-teal"></span>
            <div>
              <h6 class="font-semibold">{{ bullet.title }}</h6>
              <p class="font-light text-surface-700 text-sm">{{ bullet.description }}</p>
            </div>
          </div>
        }
      </div>
    </app-page-layout>
  </div>
</section>
