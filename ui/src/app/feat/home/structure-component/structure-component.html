<section id="structure" aria-labelledby="structure-title">
  <app-home-page-layout>
    <p class="text-xs uppercase text-clinical-teal font-semibold">Nossa estrutura</p>
    <h2 id="structure-title" class="text-2xl md:text-3xl font-semibold tracking-tighter mt-2">
      Conheça nossa estrutura
    </h2>
    <div class="grid grid-cols-1 md:grid-cols-4 mt-4 gap-6">
      @for (str of structures; track str.title) {
        <p-card>
          <ng-template #header>
            <img
              [ngSrc]="str.imgSrc"
              width="1200"
              height="1600"
              sizes="(max-width: 767px) 100vw, 25vw"
              alt=""
              class="w-full max-h-50 object-cover rounded-t-md"
            />
          </ng-template>
          <div>
            <h3 class="text-xl font-semibold">{{ str.title }}</h3>
            <p class="mt-6 font-light text-surface-700 text-sm">
              {{ str.description }}
            </p>
          </div>
        </p-card>
      }
    </div>
  </app-home-page-layout>
</section>
