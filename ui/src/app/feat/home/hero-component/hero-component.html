<section
  class="relative overflow-hidden bg-radial-[at_65%_25%] from-background from-20% via-[#eaf1f4] via-55% to-[#dcebe3] to-100%"
>
  <app-page-layout
    [class]="'relative block h-svh max-h-[76svh] lg:max-h-[55svh] mx-auto w-full max-w-6xl'"
  >
    <img
      src="/hero-img.webp"
      alt="Equipe SIMT&SE"
      class="absolute right-0 -bottom-4 md:-bottom-8 w-full md:max-w-160 xl:max-w-180 object-contain"
    />

    <div class="relative z-10 flex flex-col gap-4 max-w-md pt-16">
      <h1 class="font-black text-3xl md:text-4xl xl:text-5xl tracking-tighter">
        Mais do que exames, cuidamos de quem faz sua empresa acontecer
      </h1>

      <p class="text-sm font-light">
        Somos uma empresa familiar e acreditamos que cuidar vai muito além de realizar exames.
        Recebemos cada pessoa com proximidade, atenção e respeito, porque sabemos o valor que cada
        colaborador tem dentro e fora da empresa.
      </p>

      <div class="flex flex-wrap gap-4">
        <p-button label="Fale conosco" severity="success" icon="pi pi-whatsapp" />
        <p-button label="Agendar" severity="secondary" icon="pi pi-calendar-clock" />
      </div>
    </div>
  </app-page-layout>
</section>
