<section id="mvv" class="border-y border-clinical-teal/20 bg-surface-0">
  <app-page-layout>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      @for (mvv of mvvList; track mvv.title) {
        <div class="flex flex-col max-w-xs">
          <span
            class="max-w-min {{ mvv.icon }} text-primary-500 text-xl bg-primary-50 p-2 rounded-sm"
          ></span>
          <h3 class="mt-2 text-xl text-primary-500 uppercase font-semibold">
            {{ mvv.title }}
          </h3>
          <p class="mt-2">{{ mvv.description }}</p>
        </div>
      }
    </div>
  </app-page-layout>
</section>
