<section id="mvv" class="bg-surface-0 border-y border-clinical-teal/30">
  <app-page-layout>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      @for (mvv of mvvList; track mvv.title) {
        <p-card styleClass="shadow-none border border-clinical-teal/30">
          <div class="flex flex-col items-center gap-4">
            <span
              class="{{ mvv.icon }} text-clinical-teal text-xl bg-surface-200 p-2 rounded-sm"
            ></span>
            <h3 class="text-xl uppercase text-surface-00 font-semibold">{{ mvv.title }}</h3>
            <p class="font-light text-sm text-surface-600 text-center">{{ mvv.description }}</p>
          </div>
        </p-card>
      }
    </div>
  </app-page-layout>
</section>
