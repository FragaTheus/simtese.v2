<section id="mvv" class="border-y border-clinical-teal/20 bg-surface-0">
  <app-home-page-layout>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      @for (mvv of mvvList; track mvv.title) {
        <div class="flex flex-col max-w-xs">
          <span
            class="max-w-min {{
              mvv.icon
            }} text-clinical-teal text-xl bg-clinical-teal/10 p-2 rounded-sm"
          ></span>
          <h3 class="mt-2 text-xl text-clinical-teal uppercase font-semibold">
            {{ mvv.title }}
          </h3>
          <p class="mt-2 text-sm">{{ mvv.description }}</p>
        </div>
      }
    </div>
  </app-home-page-layout>
</section>
