<p-button (onClick)="showDialog()" label="Cadastrar" icon="pi pi-plus" />

<p-dialog
  header="Cadastro de exame"
  [modal]="true"
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  styleClass="w-full max-w-xs"
>
  <form
    [formGroup]="form"
    (ngSubmit)="create(form.getRawValue())"
    class="min-h-max py-4 flex flex-col gap-6"
  >
    <p-floatlabel variant="on">
      <input
        id="name"
        type="text"
        pInputText
        class="w-full"
        formControlName="name"
        autocomplete="off"
      />

      <label for="name"> Nome do exame </label>
    </p-floatlabel>

    @if (hasError()) {
      <div class="bg-red-50 text-red-500 p-2 rounded">
        <small>
          {{ errorMessage() }}
        </small>
      </div>
    }
    @if (hasSuccess()) {
      <div class="bg-green-50 text-green-500 p-2 rounded flex items-center justify-between">
        <small>Exame cadastrado com sucesso!</small>
      </div>
    }

    <div class="flex items-center justify-end gap-2 w-full">
      @if (hasSuccess()) {
        <p-button
          type="button"
          label="Sair"
          (onClick)="closeDialog()"
          severity="danger"
          variant="text"
        />
        <a [routerLink]="['/exames', examId()]" pButton severity="info"> Ver exame </a>
      } @else {
        <p-button
          type="button"
          label="Cancelar"
          icon="pi pi-times"
          variant="text"
          severity="danger"
          [disabled]="isLoading()"
          (onClick)="closeDialog()"
        />
        <p-button
          type="submit"
          label="Cadastrar"
          icon="pi pi-check"
          severity="success"
          [disabled]="form.invalid || isLoading()"
          [loading]="isLoading()"
        />
      }
    </div>
  </form>
</p-dialog>
