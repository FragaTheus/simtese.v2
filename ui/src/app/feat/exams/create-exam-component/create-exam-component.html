<app-input-page-layout
  icon="pi-clipboard"
  header="Cadastrar novo exame"
  description="Os exames cadastrados serão exibidos no agendamento."
  info="Nome do exame deve conter entre 2 e 100 caracteres."
  [formGroup]="form"
  submitLabel="Cadastrar"
  [loading]="loading()"
  [success]="success()"
  successMessage="Exame cadastrado com sucesso!"
  [successRoute]="successRoute()"
  [error]="errorMessage()"
  (submit)="create()"
>
  <p-floatlabel variant="on">
    <input pInputText id="examName" type="text" class="w-full" formControlName="name" />
    <label for="examName">Nome do exame</label>
  </p-floatlabel>
</app-input-page-layout>
