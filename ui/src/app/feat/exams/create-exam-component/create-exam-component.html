<app-dialog-component [title]="'Novo'" [icon]="'pi pi-plus'" [(visible)]="dialogVisible">
  <form
    [formGroup]="form"
    (ngSubmit)="create(form.getRawValue())"
    class="min-h-max py-4 flex flex-col gap-6"
  >
    <p-floatlabel variant="on">
      <input
        id="name"
        type="text"
        pInputText
        class="w-full"
        formControlName="name"
        autocomplete="off"
      />

      <label for="name"> Nome do exame </label>
    </p-floatlabel>

    @if (hasError()) {
      <div class="bg-red-50 text-red-500 p-2 rounded">
        <small>
          {{ errorMessage() }}
        </small>
      </div>
    }

    <p-button
      type="submit"
      label="Cadastrar"
      icon="pi pi-check"
      severity="success"
      [disabled]="form.invalid || isLoading()"
      [loading]="isLoading()"
      class="self-end"
    />
  </form>
</app-dialog-component>
