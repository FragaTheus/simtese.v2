<app-toast-component key="exam-created" actionLabel="Ver exame" />

@if (error()) {
  <app-error-layout />
} @else {
  <app-list-page-layout
    [page]="page()"
    [loading]="loading()"
    (pageChange)="onPageChange($event)"
    (searchChange)="onSearchChange($event)"
  >
    <div class="flex items-center gap-2 flex-wrap">
      <p-selectbutton
        [options]="statusOptions"
        [ngModel]="statusFilter()"
        (ngModelChange)="onStatusChange($event)"
        optionLabel="label"
        optionValue="value"
      />
      <app-create-exam-component (created)="onExamCreated($event)" />
    </div>
  </app-list-page-layout>
}
