@if (error() !== null) {
  <app-error-component [error]="error()">
    <p-button cancel label="Cancelar" severity="danger" [routerLink]="'/painel'" />
    <p-button retry label="Tentar novamente" severity="success" (click)="loadExams()" />
  </app-error-component>
} @else {
  <app-dash-page-layout>
    <app-dash-page-header-layout
      [loading]="loading()"
      [label]="' Catálogo Ativo'"
      [title]="'Lista de Exames'"
      [description]="'Gerencie os exames que estarão disponíveis no agendamento.'"
    >
      <app-create-exam-component (refresh)="refresh()" />
    </app-dash-page-header-layout>

    <app-dash-list-page-layout [loading]="loading()">
      <div toolbar class="w-full flex items-center justify-between flex-wrap gap-2">
        <form (ngSubmit)="onSearch()">
          <div class="flex items-center gap-2">
            <p-floatlabel variant="on">
              <input
                pInputText
                id="search"
                name="search"
                type="text"
                [(ngModel)]="params().search"
              />

              <label for="search">Pesquisar exames</label>
            </p-floatlabel>

            <p-button severity="secondary" icon="pi pi-search" type="submit" />
          </div>
        </form>
        <p-select
          [options]="activeOptions"
          optionLabel="label"
          optionValue="active"
          [(ngModel)]="params().active"
          placeholder="status"
          (onChange)="onActive($event.value)"
        />
      </div>

      <div dataview>
        @if (pageableResponse(); as page) {
          <p-dataView
            [value]="page.content"
            [paginator]="true"
            [lazy]="true"
            [first]="(params().page ?? 0) * page.size"
            [rows]="page.size"
            [totalRecords]="page.totalElements"
            (onPage)="changePage($event)"
          >
            <ng-template #list let-items>
              @for (i of items; track i.id) {
                <div
                  class="w-full flex items-center justify-between py-4 border-b border-surface-200"
                >
                  <div class="flex items-center gap-4 max-w-3xs">
                    @if (i.active) {
                      <div
                        class="bg-green-50 flex items-center gap-1 text-green-500 p-1 rounded-full"
                      >
                        <div class="size-2 rounded-full hidden md:inline bg-green-500"></div>
                        <span class="text-xs uppercase">Ativo</span>
                      </div>
                    } @else {
                      <div class="bg-red-50 flex items-center gap-1 text-red-500 p-1 rounded-full">
                        <div class="size-2 rounded-full hidden md:inline bg-red-500"></div>
                        <span class="text-xs uppercase">Inativo</span>
                      </div>
                    }

                    <span class="font-semibold truncate max-w-sm">{{ i.name }}</span>
                  </div>
                  <p-button
                    severity="secondary"
                    icon="pi pi-ellipsis-v"
                    size="small"
                    [routerLink]="'/painel/exames/' + i.id"
                  />
                </div>
              }
            </ng-template>
          </p-dataView>
        }
      </div>
    </app-dash-list-page-layout>
  </app-dash-page-layout>
}
