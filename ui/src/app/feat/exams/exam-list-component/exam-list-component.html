<app-list-page-layout
  [loading]="loading()"
  [error]="error()"
  route="/painel"
  (retry)="retry()"
  [items]="items()"
  createRoute="/painel/exames/cadastrar"
  createLabel="Cadastrar"
>
  <div class="flex flex-wrap gap-2 items-center">
    <app-router-back-component [route]="'/painel'" />
    <input
      pInputText
      class="p-inputtext-sm"
      type="text"
      placeholder="Buscar por exames..."
      [ngModel]="search()"
      (ngModelChange)="onSearch($event)"
    />
    <p-select
      [options]="statusOptions"
      optionLabel="label"
      optionValue="value"
      placeholder="Status"
      size="small"
      [ngModel]="active()"
      (ngModelChange)="active.set($event)"
    />
  </div>
</app-list-page-layout>
