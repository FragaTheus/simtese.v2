<app-info-page-layout [loading]="loading()" [error]="error()" (retry)="retry()" (cancel)="cancel()">
  <div header>
    <div class="flex items-center gap-4">
      <app-router-back-component route="/painel/exames" />
      <h1 class="text-2xl font-semibold tracking-tighter">{{ exam()?.name }}</h1>
    </div>
  </div>
  <div body>
    <div class="w-full h-full grid grid-cols-1 md:grid-cols-2 gap-6">
      <p-card>
        <ng-template #title> Informações do exame </ng-template>
        <div class="grid grid-cols-1 md:grid-cols-2 mt-4 gap-6">
          @for (f of fields; track f.label) {
            <div class="flex flex-col gap-2">
              <label class="text-xs uppercase font-semibold"> {{ f.label }}: </label>
              <span class="text-sm p-2 bg-surface-50 rounded-sm"> {{ f.value }} </span>
            </div>
          }
        </div>
      </p-card>
      <app-auditory-component [auditInfo]="auditInfo()" />
    </div>
  </div>
</app-info-page-layout>
