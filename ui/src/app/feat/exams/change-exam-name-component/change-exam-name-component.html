<app-dialog-component [title]="'Editar nome'" [severity]="'info'">
  <form
    [formGroup]="form"
    (ngSubmit)="changeName(form.getRawValue())"
    class="flex flex-col gap-6 py-4"
  >
    <p-floatlabel variant="on">
      <input
        id="name"
        type="text"
        pInputText
        formControlName="name"
        class="w-full"
        autocomplete="off"
      />

      <label for="name"> Novo nome </label>
    </p-floatlabel>

    @if (hasError()) {
      <div class="bg-red-50 text-red-500 p-2 rounded">
        <small>
          {{ errorMessage() }}
        </small>
      </div>
    }

    <div class="flex justify-end gap-2">
      <p-button
        type="button"
        label="Cancelar"
        variant="text"
        severity="danger"
        [disabled]="isLoading()"
        (click)="closeDialog()"
      />

      <p-button
        type="submit"
        label="Salvar"
        icon="pi pi-check"
        severity="success"
        [disabled]="form.invalid || isLoading()"
        [loading]="isLoading()"
      />
    </div>
  </form>
</app-dialog-component>
