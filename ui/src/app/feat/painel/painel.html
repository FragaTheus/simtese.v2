<app-dashboard-layout>
  <app-page-layout>
    @if (loading()) {
      <app-loading-layout />
    } @else if (error()) {
      <app-error-layout />
    } @else if (user(); as user) {
      <div class="w-full flex flex-col h-40 justify-center border-b border-surface-300">
        <h1 class="font-semibold text-xl">
          Bem vindo de volta, <br /><span class="text-3xl">{{ user.meName }}!</span>
        </h1>
        <p class="text-sm font-light mt-2">Gerencie os recursos internos da Simtese!</p>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 mt-8">
        @for (card of cards; track card.href) {
          <p-card>
            <ng-template #header>
              <img [src]="card.imgUrl" alt="{{ card.title }}" class="rounded-t-xl" />
            </ng-template>
            <ng-template #title>{{ card.title }}</ng-template>
            <ng-template #subtitle>{{ card.description }}</ng-template>
            <ng-template #footer>
              <a [routerLink]="card.href" pButton>
                <span class="p-button-label">Acessar</span>
              </a>
            </ng-template>
          </p-card>
        }
      </div>
    }
  </app-page-layout>
</app-dashboard-layout>
