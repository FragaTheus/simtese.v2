<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
  @if (loading()) {
    @for (item of [1, 2]; track item) {
      <p-skeleton class="p-40" />
    }
  } @else {
    <div class="bg-surface-50 p-4 rounded-md">
      <div class="flex items-center gap-2">
        <span class="pi pi-user-plus text-xl text-clinical-teal"></span>
        <h3 class="font-semibold">Criação</h3>
      </div>

      <div class="flex flex-col mt-6">
        <label class="text-xs uppercase font-semibold">Criado por:</label>
        <span>{{ createdBy() }}</span>
      </div>
      <div class="flex flex-col mt-6">
        <label class="text-xs uppercase font-semibold">Criado em:</label>
        <span>{{ createdAt() ? (createdAt() | date: 'dd/MM/yyyy HH:mm') : 'N/A' }}</span>
      </div>
    </div>
    <div class="bg-surface-50 p-4 rounded-md">
      <div class="flex items-center gap-2">
        <span class="pi pi-user-plus text-xl text-clinical-teal"></span>
        <h3 class="font-semibold">Atualização</h3>
      </div>

      <div class="flex flex-col mt-6">
        <label class="text-xs uppercase font-semibold">Atualizado por:</label>
        <span>{{ updatedBy() || 'N/A' }}</span>
      </div>
      <div class="flex flex-col mt-6">
        <label class="text-xs uppercase font-semibold">Atualizado em:</label>
        <span>{{ updatedAt() ? (updatedAt() | date: 'dd/MM/yyyy HH:mm') : 'N/A' }}</span>
      </div>
    </div>
  }
</div>
