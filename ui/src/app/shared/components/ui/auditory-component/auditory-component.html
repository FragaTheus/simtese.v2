<p-card header="Auditoria">
  <div class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="bg-surface-50 p-2 rounded-sm">
      <div class="flex items-center gap-2">
        <span class="pi pi-user-plus text-lg text-clinical-teal"></span>
        <span class="uppercase font-semibold text-sm">Cadastro</span>
      </div>

      <div class="border border-surface-400 mt-4 p-2">
        <div class="flex items-center gap-2">
          <span class="pi pi-clock inline text-clinical-teal"></span>
          <span class="text-sm">{{ auditInfo()?.createdAt | date: 'dd/MM/yyyy HH:mm' }}</span>
        </div>
        <div class="flex items-center gap-2 mt-4">
          <span class="pi pi-user text-xs inline text-clinical-teal"></span>
          <span class="text-xs">{{ auditInfo()?.createdBy }}</span>
        </div>
      </div>
    </div>

    <div class="p-2 rounded-sm">
      <div class="flex items-center gap-2">
        <span class="pi pi-refresh text-lg text-clinical-teal inline"></span>
        <span class="uppercase font-semibold text-sm">Última Atualização</span>
      </div>

      <div class="border border-surface-400 mt-4 p-2">
        <div class="flex items-center gap-2">
          <span class="pi pi-clock inline text-clinical-teal"></span>
          <span class="text-sm">
            {{
              auditInfo()?.updatedAt ? (auditInfo()?.updatedAt | date: 'dd/MM/yyyy HH:mm') : 'N/A'
            }}
          </span>
        </div>
        <div class="flex items-center gap-2 mt-4">
          <span class="pi pi-user text-xs inline text-clinical-teal"></span>
          <span class="text-xs">{{ auditInfo()?.updatedBy ? auditInfo()?.updatedBy : 'N/A' }}</span>
        </div>
      </div>
    </div>
  </div>
</p-card>
