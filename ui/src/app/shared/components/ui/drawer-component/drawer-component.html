<p-drawer
  [(visible)]="visible"
  [modal]="!isMd"
  [dismissible]="closeable()"
  [closable]="closeable()"
  [closeOnEscape]="closeable()"
  [showCloseIcon]="false"
  styleClass="bg-surface-0 md:shadow-none md:border-none md:max-w-80"
>
  <ng-template #header>
    <img src="/icon-logo.png" class="max-w-2xs mx-auto" />
  </ng-template>
  <div class="h-full w-full">
    <label class="text-xs uppercase font-semibold">Acesso Rápido</label>
    <div class="p-2 mt-2 gap-2 flex flex-col">
      @for (nb of navButtons; track nb.title) {
        <div class="w-full relative group">
          <p-button
            [label]="nb.label"
            [icon]="nb.icon"
            [routerLink]="nb.route"
            [title]="nb.title"
            severity="secondary"
            styleClass="w-full justify-start"
          />
          @if (nb.navAction) {
            <p-button
              [icon]="nb.navAction.icon"
              title="{{ nb.navAction.title }}"
              (click)="nb.navAction.action()"
              variant="text"
              severity="secondary"
              size="small"
              styleClass="absolute right-2 top-1/2 -translate-y-1/2 group-hover:bg-surface-400 group-hover:text-surface-800"
            />
          }
        </div>
      }
    </div>
  </div>
  <ng-template #footer>Footer</ng-template>
</p-drawer>

<app-create-exam-component [(visible)]="createExamVisible" />
