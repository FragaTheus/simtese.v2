@if (loading()) {
  <app-loading-component />
} @else {
  <app-error-component [error]="error()" (retry)="retry.emit()" (cancel)="cancel.emit()" />

  <div class="w-full h-full">
    <div class="w-full py-6">
      <ng-content select="[header]" />
    </div>
    <div class="w-full mt-8">
      <ng-content select="[body]" />
    </div>
  </div>
}
