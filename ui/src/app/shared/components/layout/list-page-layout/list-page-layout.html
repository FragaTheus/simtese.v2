<app-handler-layout
  [loading]="loading()"
  [error]="error()"
  [route]="route()"
  (retry)="retry.emit()"
>
  <div class="w-full h-full max-w-6xl m-auto">
    <p-toolbar>
      <ng-template #start>
        <ng-content />
      </ng-template>
      <ng-template #end>
        <p-button
          icon="pi pi-plus"
          [label]="createLabel()"
          severity="success"
          size="small"
          [routerLink]="createRoute()"
        />
      </ng-template>
    </p-toolbar>

    <p-card class="mt-8 w-full">
      <p-dataview [value]="items()">
        <ng-template #list let-items>
          @for (item of items; track item.route) {
            <div class="w-full flex justify-between items-center border-b border-surface-300 py-4">
              <div class="flex flex-col">
                @for (value of item.values; track value) {
                  <span>{{ value }}</span>
                }
              </div>
              <p-button
                icon="pi pi-ellipsis-v"
                severity="secondary"
                size="small"
                [routerLink]="item.route"
              />
            </div>
          }
        </ng-template>
      </p-dataview>
    </p-card>
  </div>
</app-handler-layout>
